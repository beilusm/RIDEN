name: Android Build

# Dev CI for Android：构建 verify + 不发布。
# 触发：push 到 main 且涉及 Android 构建相关文件；manual workflow_dispatch。

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.fvmrc'
      - 'packaging/scripts/patch_pub_cache_android.sh'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

# 取消同分支上重复运行，省 runner minutes。
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.6'
  CI: true

jobs:
  build:
    name: Android arm64-v8a Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply pub-cache patches for AGP 9 / Gradle 9 compatibility
        shell: bash
        run: bash packaging/scripts/patch_pub_cache_android.sh

      - name: Flutter analyze (informational, non-blocking)
        run: |
          # 与 release-linux/windows-build.yml 一致：CI 仅做 build 验证，
          # analyze 用作 informational report 不阻断构建。21 个 pre-existing
          # issues 是历史遗留（unused element + prefer_const 等），Phase 4
          # 不在本阶段清理。打印 report 让人能在 Actions log 看到。
          flutter analyze || true

      - name: Flutter test
        run: flutter test

      - name: Build Android Debug APK (arm64-v8a)
        run: |
          flutter build apk --debug --target-platform android-arm64
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: riden-android-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
          if-no-files-found: error
