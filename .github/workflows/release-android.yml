name: Android Tag Release

# Tag 触发的 Android Release 自动发布：构建 APK + 生成 SHA256SUMS-android.txt
# + 上传到 GitHub Release。与 release-linux.yml / release-windows.yml 互补：
#   - 同 tag 下三个 workflow 同时触发，softprops/action-gh-release@v2 复用同一 Release
#     各自只追加自己的 assets（fail_on_unmatched_files 保证独立完整性）
#   - 触发条件相同：push 以 v 开头的 tag
#   - 版本号从 tag 解析（v1.1.0 -> 1.1.0），不读取 env_android.sh hardcoded APP_VERSION
# 4 处一致铁律仍要人工保证：tag 名 v1.1.0 必须与 pubspec.yaml/env_android.sh/env.sh
# /env_windows.sh 同步。

on:
  push:
    tags:
      - 'v*'

# Tag 触发的 release 构建不取消进行中的（同 tag 重打少，跨 tag 并发保留）
concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.6'
  CI: true

permissions:
  contents: write   # softprops/action-gh-release 需要 permission 创建 Release + 上传 assets

jobs:
  release:
    name: Android arm64-v8a Release (Tag-triggered)
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version from tag
        id: ver
        run: |
          # GITHUB_REF_NAME = "v1.1.0" / "v1.1.0-rc.1" 等
          # 期望去掉前导 v 得到 "1.1.0"，与 pubspec.yaml / env_android.sh /
          # env.sh / env_windows.sh 4 处一致铁律对齐
          raw="${{ github.ref_name }}"
          echo "raw tag: $raw"
          if [[ ! "$raw" =~ ^v(.+)$ ]]; then
            echo "::error::tag '$raw' 不匹配 '^v.+' 期望格式（v 开头，例 v1.1.0 / v1.1.0-rc.1）"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          echo "parsed version: $version"
          echo "APP_VERSION=$version" >> $GITHUB_ENV

      - name: Verify tag version matches pubspec.yaml
        run: |
          # 4 处一致铁律自动化校验：tag 的 semver 必须与 pubspec.yaml version 字段前部分一致。
          # pubspec.yaml 格式："version: 1.1.0+1" — 只比较 + 前的 semver
          # tag 格式：v1.1.0 / v1.1.0-rc.1 — 用 env.APP_VERSION（已 strip v 前缀）
          # 不一致即 exit 1，避免 Release 产物版本号错配。
          tag_version="$APP_VERSION"
          pubspec_line=$(grep -E '^[[:space:]]*version:[[:space:]]' pubspec.yaml | head -1)
          if [[ -z "$pubspec_line" ]]; then
            echo "::error::pubspec.yaml 未找到 version: 字段"
            exit 1
          fi
          pubspec_version=$(echo "$pubspec_line" | sed -E 's/^[[:space:]]*version:[[:space:]]*([^[:space:]]+).*/\1/')
          # 只取 + 前部分（SemVer build metadata 不参与比较）
          pubspec_semver="${pubspec_version%%+*}"
          # tag 中 -rc.1 之类 prerelease 也不参与比较
          # 必须用 %%-*（最长后缀删除）而非 %-*（最短）— 否则
          # "1.1.0-linux-test" 会被切成 "1.1.0-linux" 而非 "1.1.0"
          tag_semver="${tag_version%%-*}"
          echo "tag version:      $tag_version"
          echo "pubspec version:  $pubspec_version"
          echo "tag semver:       $tag_semver (after strip prerelease suffix)"
          echo "pubspec semver:   $pubspec_semver (after strip +build)"
          if [[ "$tag_semver" != "$pubspec_semver" ]]; then
            echo "::error::Tag version $tag_semver != pubspec.yaml version $pubspec_semver"
            exit 1
          fi
          echo "OK: tag semver matches pubspec.yaml semver ($tag_semver)"

      - name: Verify env_android.sh APP_VERSION matches tag semver
        run: |
          # Phase 4 / L1.2 扩展：env_android.sh APP_VERSION 是 S6 版本来源。
          # CI 自动校验 — tag push 时若忘记同步 env_android.sh，本 step fail。
          if [[ ! -f packaging/config/env_android.sh ]]; then
            echo "::error::packaging/config/env_android.sh not found"
            exit 1
          fi
          env_line=$(grep -E '^export APP_VERSION=' packaging/config/env_android.sh | head -1)
          if [[ -z "$env_line" ]]; then
            echo "::error::env_android.sh 未找到 'export APP_VERSION=' 字段"
            exit 1
          fi
          env_version=$(echo "$env_line" | sed -E 's/^export APP_VERSION="([^"]*)".*/\1/')
          if [[ -z "$env_version" ]]; then
            echo "::error::env_android.sh APP_VERSION 值为空"
            exit 1
          fi
          tag_semver="${APP_VERSION%%-*}"
          echo "tag version:              $APP_VERSION"
          echo "tag semver:               $tag_semver (strip prerelease suffix)"
          echo "env_android.sh APP_VERSION: $env_version"
          if [[ "$tag_semver" != "$env_version" ]]; then
            echo "::error::Tag semver $tag_semver != env_android.sh APP_VERSION $env_version"
            echo "请同步 packaging/config/env_android.sh APP_VERSION=\"${tag_semver}\""
            exit 1
          fi
          echo "OK: tag semver matches env_android.sh APP_VERSION ($tag_semver)"

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply pub-cache patches for AGP 9 / Gradle 9 compatibility
        shell: bash
        run: |
          # Phase 4 §7 — usb_serial 0.5.2 / flutter_libserialport 0.4.0 /
          # file_picker 8.3.7 在 AGP 9 / Gradle 9 下需要 pub-cache patch。
          # CI 执行三步 patch（重写整个 build.gradle + Kotlin stub），等效
          # 本地 §7.1 手工步骤。`flutter pub get` 后 patch 文件不会被还原，
          # 只在 `pub get --force` / `pub cache clean` 后需要重 patch。
          set -e

          # ── Patch 1: usb_serial 0.5.2 android/build.gradle ──────────
          # 原版 upstream 用 jcenter() + AGP 4.1.0 classpath，Gradle 9 已删除
          # jcenter()。重写成兼容版本（删 jcenter + 删 AGP 4.1 classpath）。
          cat > "$HOME/.pub-cache/hosted/pub.dev/usb_serial-0.5.2/android/build.gradle" <<'PATCH'
          group 'dev.bessems.usbserial'
          version '1.0'

          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
              }

              gradle.projectsEvaluated {
                  tasks.withType(JavaCompile) {
                      options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
                  }
              }
          }

          apply plugin: 'com.android.library'

          android {
              compileSdk 34

              namespace 'dev.bessems.usbserial'

              defaultConfig {
                  minSdkVersion 16
                  testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
              }
              lintOptions {
                  disable 'InvalidPackage'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation 'com.github.felHR85:UsbSerial:6.1.0'
          }
          PATCH

          # ── Patch 2: flutter_libserialport 0.4.0 android/build.gradle ─
          cat > "$HOME/.pub-cache/hosted/pub.dev/flutter_libserialport-0.4.0/android/build.gradle" <<'PATCH'
          group 'org.sigrok.flutter_libserialport'
          version '1.0-SNAPSHOT'

          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          apply plugin: 'com.android.library'

          android {
              namespace 'org.sigrok.flutter_libserialport'

              final def rootProjectCompileSdk = rootProject.ext.has("compileSdkVersion")
                  ? rootProject.ext.get("compileSdkVersion")
                  : 34
              compileSdk rootProjectCompileSdk

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              defaultConfig {
                  minSdk 21
              }
              lintOptions {
                  disable 'InvalidPackage'
              }

              sourceSets {
                  main {
                      java.srcDirs = []
                      kotlin.srcDirs = []
                      res.srcDirs = []
                      assets.srcDirs = []
                  }
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
              }
          }

          dependencies {
          }
          PATCH

          # ── Patch 3: flutter_libserialport 0.4.0 FlutterLibserialportPlugin.kt ─
          # Stub v2 embedding（删 v1 Registrar 引用——AGP 9 / Flutter 3.44 已移除）
          cat > "$HOME/.pub-cache/hosted/pub.dev/flutter_libserialport-0.4.0/android/src/main/kotlin/org/sigrok/flutter_libserialport/FlutterLibserialportPlugin.kt" <<'PATCH'
          package org.sigrok.flutter_libserialport

          import io.flutter.embedding.engine.plugins.FlutterPlugin

          class FlutterLibserialportPlugin : FlutterPlugin {
              override fun onAttachedToEngine(binding: FlutterPlugin.FlutterPluginBinding) {}
              override fun onDetachedFromEngine(binding: FlutterPlugin.FlutterPluginBinding) {}
          }
          PATCH

          # ── Patch 4: file_picker 8.3.7 android/build.gradle ─────────
          cat > "$HOME/.pub-cache/hosted/pub.dev/file_picker-8.3.7/android/build.gradle" <<'PATCH'
          group 'com.mr.flutter.plugin.filepicker'
          version '1.0-SNAPSHOT'

          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          apply plugin: 'com.android.library'

          android {
              final def rootProjectCompileSdk = rootProject.ext.has("compileSdkVersion")
                  ? rootProject.ext.get("compileSdkVersion")
                  : 36
              compileSdk rootProjectCompileSdk

              defaultConfig {
                  minSdk 21
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }
              lintOptions {
                  disable 'InvalidPackage'
              }

              dependencies {
                  implementation 'androidx.core:core:1.0.2'
                  implementation 'androidx.annotation:annotation:1.0.0'
                  implementation "androidx.lifecycle:lifecycle-runtime:2.1.0"
              }

              if (project.android.hasProperty("namespace")) {
                  namespace 'com.mr.flutter.plugin.filepicker'
              }
          }
          PATCH

          echo "=== pub-cache patches applied ==="
          ls -la "$HOME/.pub-cache/hosted/pub.dev/flutter_libserialport-0.4.0/android/build.gradle"
          ls -la "$HOME/.pub-cache/hosted/pub.dev/flutter_libserialport-0.4.0/android/src/main/kotlin/org/sigrok/flutter_libserialport/FlutterLibserialportPlugin.kt"
          ls -la "$HOME/.pub-cache/hosted/pub.dev/file_picker-8.3.7/android/build.gradle"

      - name: Build Android Release APK (arm64-v8a)
        run: |
          flutter build apk --release --target-platform android-arm64
          # ABI 隔离 reduced APK — 单 arm64-v8a 切片用于 Android 11+ OTG
          # 设备主流 ABI (~98% 覆盖)。v1.2.0 起引入 appbundle 多 ABI。
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Rename APK + Generate SHA256SUMS-android.txt
        run: |
          set -e
          mkdir -p release
          src=$(ls build/app/outputs/flutter-apk/app-arm64-v8a-release.apk 2>/dev/null || ls build/app/outputs/flutter-apk/app-release.apk)
          dst="release/RIDEN_PowerSupply-${APP_VERSION}-android-arm64-v8a.apk"
          mv "$src" "$dst"
          echo "renamed: $src -> $dst"
          ls -lh "$dst"
          cd release
          # SHA256SUMS-android.txt 格式对齐 sha256sum(1) "<sha>  <filename>"
          sha256sum "$(basename "$dst")" > SHA256SUMS-android.txt
          echo "===SHA256SUMS-android.txt==="
          cat SHA256SUMS-android.txt

      - name: Compute APK SHA256 + size (for Actions log visibility)
        run: |
          cd release
          apk="$(ls RIDEN_PowerSupply-*.apk | head -1)"
          sha=$(sha256sum "$apk" | awk '{print $1}')
          size=$(stat --printf=%s "$apk")
          size_mb=$(awk "BEGIN{printf \"%.2f\", $size/1024/1024}")
          echo "APK: $apk"
          echo "SHA256: $sha"
          echo "Size: $size bytes ($size_mb MB)"

      - name: Create or update GitHub Release + upload Android assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ contains(env.APP_VERSION, '-') }}
        run: |
          set -e
          tag="${{ github.ref_name }}"
          title="RIDEN Power Supply ${APP_VERSION}"
          apk="release/RIDEN_PowerSupply-${APP_VERSION}-android-arm64-v8a.apk"
          sums="release/SHA256SUMS-android.txt"

          # Pre-flight
          echo "=== pre-flight: verify assets ==="
          ls -la "$apk" || { echo "::error::missing APK at ${apk}"; exit 1; }
          ls -la "$sums" || { echo "::error::missing SHA256SUMS at ${sums}"; exit 1; }

          # Body markdown — 简洁跨平台 release notes
          body_file="$(mktemp)"
          cat > "$body_file" <<'BODY_END'
          # RIDEN Power Supply ${{ env.APP_VERSION }}

          Android OTG 版本。手机 + Type-C OTG 线 + CH340 USB-Serial 即插即用。

          ## 安装

          ### Android (arm64-v8a, Android 5.0+)

          1. 下载 `RIDEN_PowerSupply-${{ env.APP_VERSION }}-android-arm64-v8a.apk`
          2. 手机"安全 — 允许此来源安装"开启（开发者选项）
          3. 用文件管理器点击 APK → 安装
          4. OTG 线接 CH340 模块 → USB-C 接手机 → 弹出"打开 RIDEN Power Supply"
          5. App 自动连接电源并显示 V/A/W 波形

          ## 校验完整性

          ```bash
          sha256sum -c SHA256SUMS-android.txt
          ```

          ## 前置依赖

          - Android 5.0+ (API 21+) 手机
          - USB Host feature（中低端机多数支持）
          - OTG 线（Type-C 转 USB-A 母）

          ## 源码

          对应源码 commit: ${{ github.sha }}
          BODY_END

          # 同时创建 Release + 上传 Android assets
          if gh release create "$tag" "$apk" "$sums" \
               --title "$title" \
               --notes-file "$body_file" \
               --prerelease="${PRERELEASE}" 2>&1; then
            echo "=== Release $tag created + Android assets uploaded ==="
          else
            echo "=== Release $tag already exists (race), falling back to upload-only ==="
            gh release upload "$tag" "$apk" "$sums" --clobber
          fi

          echo "=== Release $tag final state ==="
          gh release view "$tag"
