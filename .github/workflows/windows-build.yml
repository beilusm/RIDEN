name: Windows Release Build

# 只生成 ZIP artifact，不上传 Release，不修改源码，不做签名。
# 触发：push 到 main 且涉及 Windows 构建相关文件；manual workflow_dispatch。

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.fvmrc'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

# 取消同分支上重复运行，省 runner minutes。
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.6'
  # APP_VERSION 必须与 4 处一致铁律保持同步：
  #   pubspec.yaml (version: 1.0.0+1) / windows/runner/Runner.rc (VERSION_AS_STRING)
  #   packaging/config/env_windows.sh (APP_VERSION) / linux/CMakeLists.txt:10 (APPLICATION_ID)
  APP_VERSION: '1.0.0'
  CI: true

jobs:
  build:
    name: Windows x64 Release ZIP
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows Release bundle
        run: flutter build windows --release

      - name: Verify exe presence
        shell: pwsh
        run: |
          $exe = "build/windows/x64/runner/Release/riden_power_supply.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error::riden_power_supply.exe missing from build bundle"
            exit 1
          }
          Write-Host "OK: $exe found"
          Write-Host "===Release bundle contents==="
          Get-ChildItem build/windows/x64/runner/Release/ | Format-Table Name, Length -AutoSize

      - name: Stage bundle under RIDEN_PowerSupply/ top dir
        shell: pwsh
        run: |
          $bundle = "build/windows/x64/runner/Release"
          $staging = "staging/RIDEN_PowerSupply"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -Path "$bundle/*" -Destination $staging -Recurse -Force
          Write-Host "Staged $((Get-ChildItem $staging -Recurse -File).Count) files under $staging/"
          Write-Host "===Staged tree==="
          Get-ChildItem $staging -Recurse | Format-Table FullName, Length -AutoSize

      - name: Generate SHA256SUMS-windows.txt
        shell: pwsh
        run: |
          # 与本地 make_windows_zip.sh 行为对齐：
          #   - 遍历 staging/RIDEN_PowerSupply/ 下全部文件
          #   - 按 sha256sum(1) 格式输出 "<hash> *<relpath>"，便于 `sha256sum -c` 校验
          #   - manifest 放 staging/ 父目录，不污染最终 ZIP 内的 RIDEN_PowerSupply/ bundle
          $staging = "staging/RIDEN_PowerSupply"
          $out = "staging/SHA256SUMS-windows.txt"
          $lines = @()
          Get-ChildItem $staging -Recurse -File | Sort-Object FullName | ForEach-Object {
            $rel = $_.FullName.Substring((Resolve-Path $staging).Path.Length + 1).Replace('\','/')
            $sha = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            $lines += "$sha *RIDEN_PowerSupply/$rel"
          }
          $lines | Out-File -FilePath $out -Encoding ascii -NoNewline:$false
          Write-Host "===SHA256SUMS-windows.txt ($($lines.Count) entries)==="
          Get-Content $out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RIDEN_PowerSupply-${{ env.APP_VERSION }}-windows-x64
          # path 指向 staging 父目录（而非 staging/RIDEN_PowerSupply），
          # 让 upload-artifact@v4 保留 RIDEN_PowerSupply/ 顶层目录在 ZIP 内，
          # 与本地 make_windows_zip.sh 输出格式一致 — 用户解压即得到统一顶层目录。
          # 同时打包 SHA256SUMS-windows.txt 到 artifact 顶层（与 ZIP 并列，供下载者独立校验）。
          path: staging
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload SHA256SUMS-windows.txt
        uses: actions/upload-artifact@v4
        with:
          name: RIDEN_PowerSupply-${{ env.APP_VERSION }}-windows-x64-SHA256SUMS
          path: staging/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
